name: Verify public print assets
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/store.js'
      - 'assets/js/viewer.js'
      - 'assets/css/main*.css'
      - '.github/workflows/verify-public-print-assets.yml'
  pull_request:
    paths:
      - '.github/workflows/verify-public-print-assets.yml'
      - 'scripts/verify-public-print-assets.cjs'
permissions:
  contents: read
jobs:
  public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check verifier syntax
        run: node --check scripts/verify-public-print-assets.cjs
      - name: Wait for normal Pages CD and verify public SHA256
        if: github.event_name == 'push'
        run: node scripts/verify-public-print-assets.cjs
