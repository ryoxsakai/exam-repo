name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "panel/**"
      - "assets/js/markup.js"
      - "assets/js/viewer.js"
      - "assets/js/print-settings.js"
      - "index.html"
      - "assets/css/main.css"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and verify Exam conversation panel
        run: |
          npm ci --prefix panel
          npm run build --prefix panel
          npm test --prefix panel
          node scripts/test-question-hierarchy.cjs
          node scripts/test-paragraph-blanks.cjs
          node scripts/test-fullwidth-choices.cjs
          node scripts/test-glossary-lemma.cjs
          node scripts/test-glossary-table-boundary.cjs
          node scripts/test-annotation-placement.cjs
          node scripts/test-d1-overload.cjs
          node scripts/test-oauth-browser-session.cjs
          node scripts/test-oauth-refresh.cjs
          node scripts/test-question-validation.cjs
          node scripts/test-mcp-sections.cjs
          node scripts/test-zenyaku-title.cjs

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker/index.ts --name medical-exam-worker

      - name: Verify published print UI (read only)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-public-print-assets.cjs
