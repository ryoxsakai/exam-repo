name: Test favorite folder parent selection
on:
  pull_request:
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "index.html"
      - "scripts/test-favorite-folder-parent*.cjs"
      - ".github/workflows/favorite-folder-parent-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  favorite-folder-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-favorite-folder-parent-unit.cjs
      - run: npm ci --prefix panel
      - run: ./panel/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/test-favorite-folder-parent.cjs
