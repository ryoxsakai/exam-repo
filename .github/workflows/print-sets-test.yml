name: Test multi-exam print sets
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'assets/**'
      - 'index.html'
      - 'scripts/*print*'
      - '.github/workflows/print-sets-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print-sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix panel
      - run: npm run build --prefix panel
      - run: node scripts/test-print-sets.cjs
      - run: ./panel/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.14.2
      - run: node scripts/test-print-sets-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-sets-browser-pdf
          path: /tmp/exam-print-sets-qa
          if-no-files-found: ignore
