name: Test multi-exam print sets
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'assets/**'
      - 'index.html'
      - 'setting/**'
      - 'scripts/*print*'
      - '.github/workflows/print-sets-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print-sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix panel
      - run: npm run build --prefix panel
      - name: Print and OAuth regressions (isolated SQLite)
        run: |
          node scripts/test-print-sets.cjs
          node scripts/test-print-duration.cjs
          node scripts/test-print-duration-merges.cjs
          node scripts/test-print-name-field.cjs
          node scripts/test-print-renumber.cjs
          node scripts/test-print-line-numbers.cjs
          node scripts/test-print-writing-space.cjs
          node scripts/test-section-saving.cjs
          node scripts/test-oauth-browser-session.cjs
          node scripts/test-oauth-refresh.cjs
      - run: ./panel/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.14.2 PyMuPDF==1.26.6
      - name: Desktop and mobile UI, modal history, saved selections and A4 PDF
        run: |
          node scripts/test-print-ui-sync.cjs
          node scripts/test-print-university-settings.cjs
          node scripts/test-print-choices.cjs
          node scripts/test-print-answers-browser.cjs
          node scripts/test-print-sets-browser.cjs
          node scripts/test-print-name-field.cjs --browser
          node scripts/test-print-duration-browser.cjs
          node scripts/test-print-line-numbers-browser.cjs
          node scripts/test-print-renumber-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-sets-browser-pdf
          path: /tmp/exam-print-sets-qa
          if-no-files-found: ignore
